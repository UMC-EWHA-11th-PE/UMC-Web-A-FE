<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 첫 웹 페이지</title>
    <style>
        header {
            background-color: #f8fafc;
            padding: 16px;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 16px;
            padding: 0;
            margin: 0;
        }

        li a {
            text-decoration: none;
            color: #1e293b;
            font-weight: 500;
        }

        h1 {
            font-weight: 700;
        }

        .description {
            color: #475569;
        }

        #page-title {
            letter-spacing: -0.02em;
        }

        .learning-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }

        .learning-table th,
        .learning-table td {
            border: 1px solid #e2e8f0;
            padding: 8px;
            text-align: left;
        }

        .card {
            width: 320px;
            max-width: 100%;
            padding: 24px;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            margin: 16px;
            box-sizing: border-box;
        }

        .cards {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-start;
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">홈</a></li>
                <li><a href="about.html">소개</a></li>
                <li><a href="contact.html">연락처</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
            <h1>이번 주 학습 기록</h1>
            <p>이번 주 동안 배운 내용을 정리해보았습니다.</p>
            <table class="learning-table">
                <thead>
                    <tr>
                        <th>날짜</th>
                        <th>학습 내용</th>
                        <th>학습 시간</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>2026-09-17</td>
                        <td>HTML 기초</td>
                        <td>2시간</td>
                    </tr>
                    <tr>
                        <td>2026-09-17</td>
                        <td>CSS 기초</td>
                        <td>3시간</td>
                    </tr>
                    <tr>
                        <td>2026-09-17</td>
                        <td>JavaScript 기초</td>
                        <td>4시간</td>
                    </tr>
                </tbody>
            </table>
        </section>
        <hr>
        <section>
            <h1>기술 목록</h1>
            <div class="cards">
                <div class="card">
                    <h2>HTML</h2>
                    <p class="description">웹 페이지의 구조를 정의하는 마크업 언어입니다.</p>
                </div>
                <div class="card">
                    <h2>CSS</h2>
                    <p class="description">웹 페이지의 스타일을 정의하는 스타일 시트 언어입니다.</p>
                </div>
                <div class="card">
                    <h2>JavaScript</h2>
                    <p class="description">웹 페이지에 동적인 기능을 추가하는 프로그래밍 언어입니다.</p>
                </div>
            </div>
        </section>
        <aside>관련 링크</aside>
    </main>
    <footer>
        <p>&copy; 2024 나의 웹 페이지</p>
    </footer>
    <script>
        const student = {
            name: "광수",
            skills: ["HTML", "CSS", "JavaScript"],
        };

        function printSkills(skills) {
            for (const skill of skills) {
                if (skill === "JavaScript") {
                    console.log(`${skill}: 화면에 동작을 더합니다.`);
                }
                else {
                    console.log(skill);
                }
            }
        }

        console.log(student.name);
        printSkills(student.skills);

        

    </script>
</body>

</html>
